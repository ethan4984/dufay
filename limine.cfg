TIMEOUT=3

:dufay
	PROTOCOL=limine
	KERNEL_PATH=boot:///boot/dufay.elf
	MODULE_PATH=boot:///servers/sched
	MODULE_CMDLINE=scheduler
	MODULE_PATH=boot:///servers/pci
	MODULE_CMDLINE=pci
	MODULE_PATH=boot:///servers/nvme
	MODULE_CMDLINE=nvme
	MODULE_PATH=boot:///servers/vfs
	MODULE_CMDLINE=vfs
	MODULE_PATH=boot:///servers/nvme_irq
	MODULE_CMDLINE=nvme_irq
	kaslr=no
