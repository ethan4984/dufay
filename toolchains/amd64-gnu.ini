[binaries]
c = 'gcc'
nasm = 'nasm'

[built-in options]
c_args = ['-mabi=sysv','-mgeneral-regs-only' ]

c_link_args = ['-Wl,-z,max-page-size=0x1000', '-Wl,--build-id=none', '-nostdlib', '-static', '-T../arch/amd64/linker.ld']

[host_machine]
system = 'dufay'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

