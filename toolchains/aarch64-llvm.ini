[binaries]
c = 'clang'
cpp = 'clang++'
c_ld = 'lld'
cpp_ld = 'lld'

[built-in options]
c_args = ['-target', 'aarch64-elf','-mgeneral-regs-only' ]

c_link_args = ['-target', 'aarch64-elf', '-Wl,-z,max-page-size=0x1000', '-Wl,--build-id=none', '-nostdlib', '-static']

[host_machine]
system = 'dufay'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
