[binaries]
c = 'clang'
c_ld = 'lld'
nasm = 'nasm'

[built-in options]
c_args = ['-target', 'x86_64-unknown-elf', '-mabi=sysv','-mgeneral-regs-only' ]

c_link_args = ['-target', 'x86_64-unknown-elf', '-Wl,-z,max-page-size=0x1000', '-Wl,--build-id=none', '-nostdlib', '-static']

[host_machine]
system = 'dufay'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
